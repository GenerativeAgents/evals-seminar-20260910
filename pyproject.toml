[project]
name = "evals-seminar-20260910"
version = "0.1.0"
description = "Weave live evaluation for the arXiv-paper slide-generation workflow"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.80",
    "python-dotenv>=1.0",
    "weave[scorers]>=0.53.6,<0.54",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["eval/tests"]
asyncio_mode = "auto"

[tool.uv]
required-version = ">=0.13.4"
# Minimum versions with the emSign CA incident fix, including transitive pip.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
